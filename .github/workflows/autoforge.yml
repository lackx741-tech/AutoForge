name: AutoForge CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: autoforge-io

jobs:
  build-and-test:
    runs-on: macos-latest  # Native macOS build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Docker (macOS)
        run: |
          brew install docker docker-compose
          mkdir -p ~/.docker/cli-plugins
          brew install docker-buildx || true

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build CKG Service
        run: |
          cd cmd/ckg-service
          go mod tidy
          go build -v -o ../../bin/ckg-service-darwin

      - name: Build Saga Supervisor
        run: |
          cd cmd/saga-supervisor
          go mod tidy
          go build -v -o ../../bin/saga-supervisor-darwin

      - name: Build CLI
        run: |
          cd cmd/cli
          go mod tidy
          go build -v -o ../../bin/autoforge-darwin

      - name: Test Services
        run: |
          chmod +x bin/ckg-service-darwin
          ./bin/ckg-service-darwin &
          sleep 2
          curl -f http://localhost:8080/health || exit 1
          pkill ckg-service-darwin || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: autoforge-binaries
          path: bin/

  build-containers:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ckg-service
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/saga-supervisor
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cli

      - name: Build and push CKG Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/Dockerfile.ckg
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ckg-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Saga Supervisor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/Dockerfile.saga
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/saga-supervisor:latest

      - name: Build and push CLI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/Dockerfile.cli
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cli:latest

  integration-test:
    runs-on: ubuntu-latest
    needs: build-containers

    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          docker-compose up -d
          sleep 10
          curl -f http://localhost:8080/health
          curl -f http://localhost:8081/health

          # Submit test saga
          curl -X POST http://localhost:8081/saga \
            -H "Content-Type: application/json" \
            -d '{"repo_url":"https://github.com/test/repo","commit_sha":"abc123"}'

          docker-compose down

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [build-containers, integration-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy CRDs
        run: |
          kubectl apply -f crds/sandboxcell-crd.yaml
          kubectl get crd sandboxcells.autoforge.io
