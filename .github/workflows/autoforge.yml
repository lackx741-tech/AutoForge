name: AutoForge CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: go.sum

      - name: Build CKG Service (CGO for SQLite)
        run: CGO_ENABLED=1 go build -v -o bin/ckg-service-darwin ./cmd/ckg-service

      - name: Build Saga Supervisor
        run: go build -v -o bin/saga-supervisor-darwin ./cmd/saga-supervisor

      - name: Build CLI
        run: go build -v -o bin/autoforge-darwin ./cmd/cli

      - name: Smoke test CKG Service
        run: |
          ./bin/ckg-service-darwin &
          sleep 3
          curl -f http://localhost:8080/health
          pkill ckg-service-darwin || true

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: autoforge-macos
          path: bin/

  build-containers:
    runs-on: ubuntu-latest
    needs: build-macos
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CKG Service
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployments/Dockerfile.ckg
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ckg-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ckg-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Saga Supervisor
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployments/Dockerfile.saga
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/saga-supervisor:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/saga-supervisor:${{ github.sha }}

      - name: Build and push CLI
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployments/Dockerfile.cli
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cli:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cli:${{ github.sha }}

  integration-test:
    runs-on: ubuntu-latest
    needs: build-containers
    steps:
      - uses: actions/checkout@v7

      - name: Run integration tests
        run: |
          docker compose up -d --build
          sleep 10
          curl -f http://localhost:8080/health
          curl -f http://localhost:8081/health
          curl -X POST http://localhost:8081/saga \
            -H "Content-Type: application/json" \
            -d '{"repo_url":"https://github.com/test/repo","commit_sha":"abc123"}'
          docker compose down
