services:
  ckg-service:
    build:
      context: .
      dockerfile: ./deployments/Dockerfile.ckg
    ports:
      - "8080:8080"
    volumes:
      - ckg-data:/data
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  saga-supervisor:
    build:
      context: .
      dockerfile: ./deployments/Dockerfile.saga
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - CKG_URL=http://ckg-service:8080
    depends_on:
      ckg-service:
        condition: service_healthy

volumes:
  ckg-data:
